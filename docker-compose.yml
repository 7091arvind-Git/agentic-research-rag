version: "3.8"

services:
  ai-research-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-research-analyzer
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=http://localhost:8000
    restart: unless-stopped
